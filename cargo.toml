[workspace]
resolver = "2"
members = [
    "crates/engine","crates/datacore", "crates/collect", "crates/cli", "crates/control", "crates/lsp"]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"