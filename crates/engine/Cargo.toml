[package]
name = "jingwei-engine"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
# 图谱库。用 bundled 而不是链接系统 sqlite：FTS5 与 JSON1 都自带，
# 不需要在用户机器上赌 winsqlite3.dll 的版本（实测：sqlite 3.46.0，fts5=true）。
# 编译要多花十几秒（要编一份 SQLite 的 C 源码，MSVC 由 cc crate 自己找）。
rusqlite = { version = "0.32", features = ["bundled"] }
# 领域模型。设计 §3.1 写的依赖方向是 `adapters → engine → model`，
# 而在接上 store 之前这条边**在代码里根本不存在**——model 是个孤岛
# （15 条测试、零个消费者）。依赖方向写在文档里不算数，得让 Cargo.toml 说话。
jingwei-model = { path = "../model" }
# 解析：把源码变成符号。Q8 实测过版本兼容（core 0.27 + rust 0.24），
# 也实测过体积（core + 1 个语法 = 1.3MB，之后每加一门约 1.14MB）。
#
# **2026-10-16 加了第二门（Python）。** 注释里原来写着"先只做 Rust：
# 设计 §1.2 那条『加语言只许改 lang.rs 一处』的判据，要等第二门语言进来才验得了"——
# 现在就是来验它的。**实测结果是那条判据不成立**（详见 `graph/parse.rs` 文件头），
# 债记在 `AGENTS.md` §5。
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"

# **只为了一个 Win32 调用**：`ReadDirectoryChangesW`（增量扫的变更事实，D-03）。
# 不用 `winapi`：它已经多年不更新；`windows-sys` 与本机 cargo 缓存里的版本一致，离线可编。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_System_IO",
] }

[lints]
workspace = true
