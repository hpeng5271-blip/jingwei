[package]
name = "jingwei-app"
version.workspace = true
edition.workspace = true
description = "jingwei 的桌面外壳：只做展示和转接，逻辑一个都不重复"

[[bin]]
name = "jingwei-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jingwei-engine = { path = "../crates/engine" }

[lints]
workspace = true
